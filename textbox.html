<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Textbox</title>
    <style>
        /*  OBS CUSTOM CSS VARIABLEN */
        :root {
            /* BOX-ID: Wird in OBS im "Benutzerdefiniertes CSS" Feld pro Quelle gesetzt */
            --box-id: "default";

            /* TEXTZEILEN (CSS-Eingabe / Fallback) */
            --zeile-1: "";
            --zeile-2: "";
            --zeile-3: ""; 

            /* Design-Einstellungen */
            --box-bg: rgba(255, 255, 255, 0.75);    
            --box-border: rgba(0, 0, 0, 0.7);       
            --triangle-color-a: #fce647;            
            --triangle-color-b: #fce647;            
            --triangle-background: linear-gradient(135deg, var(--triangle-color-a) 50%, transparent 50%), linear-gradient(315deg, var(--triangle-color-b) 50%, transparent 50%);
            --text-color: #000000;
        }

      /* generelles Styling */
        html, body {
            overflow: hidden !important;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        body {
            background: transparent;
            margin: 0;
            padding: 20px; 
            padding-top: 350px; /* Großzügiger Platz nach oben für große Animationen */
            padding-left: 250px; /* Platz nach links, damit Animationen nicht abschneiden */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

      /* generelles Styling */
        .textbox-container {
            /* Textbox-Container */
            position: relative;
            background-color: var(--box-bg);
            /* Ecken /(Dreiecke) */
            background-image: var(--triangle-background);
            background-position: top left, bottom right;
            background-size: 50px 50px, 50px 50px;
            background-repeat: no-repeat;
            /* Rand */
            border: 0px solid var(--box-border);
            /* Ecken abrundungen */
            border-radius: 4px 4px 4px 4px;

            /* Größen und Abstände */
            min-width: 300px;
            width: max-content; /* Passt sich der Textlänge an */
            max-width: 800px;
            min-height: 1.5em;  /* Schrumpft auf Minimum eine Zeile */
            
            /* Padding: Textabstand zum Rand bzw. den Dreiecken */
            padding: 15px 60px 20px 50px; 
            
            display: flex;
            flex-direction: column;
            justify-content: center;

            /* Sichtbarkeit: 1 = sichtbar (Default), wird von OBS/Control-Dashboard
               auf 0 gesetzt, wenn die Box geleert werden soll */
            opacity: var(--box-opacity, 1);
            transition: opacity 0.3s ease;
        }

        /* Styling der Textzeilen */
        .text-line {
            line-height: 1.2;
            color: var(--text-color);
        }

        /* CSS Elemente um Text einzufügen */
        .text-line::before {
            display: inline-block;
            white-space: pre-wrap; 
            font-size: 32px;       
        }

        /* Zuweisung der CSS-Variablen zu den Zeilen */
        .line1::before { content: var(--zeile-1); }
        .line2::before { content: var(--zeile-2); }
        .line3::before { content: var(--zeile-3); }

        /* Styling der ersten Zeile */
        .line1::before {
            font-size: 38px;       
            font-weight: 500;     
            margin-bottom: 5px;
        }
        
        /* Styling der zweiten Zeile */
        .line2::before {
            font-size: 32px;
            font-weight: 400;
        }

        /* Styling der dritten Zeile */
        .line3::before {
            font-size: 32px;
            font-weight: 400;
        }

        /* Animation Container */
        .anim-wrapper {
            position: absolute;
            bottom: 100%;
            right: 0;
            margin-bottom: 15px;
            z-index: 10;
            /* Translation und Skalierung. Translate zuerst, damit die X/Y Pixel absolut sind */
            transform: translate(var(--anim-x, 0px), var(--anim-y, 0px)) scale(var(--anim-scale, 3));
            transform-origin: bottom right;
        }
        .anim-wrapper img, .anim-wrapper video {
            display: block;
            /* Pixelperfect Rendering, damit es beim Vergrößern nicht unscharf wird */
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <!-- HTML Struktur ohne Leerzeichen zwischen den Divs -->
    <div class="textbox-container" id="box-container">
        <div class="anim-wrapper" id="anim-wrapper" style="display: none;"></div>
        <div class="text-line line1"></div>
        <div class="text-line line2"></div>
        <div class="text-line line3"></div>
    </div>

    <script>
        // Auto-verbirgt leere Textzeilen, damit sich die Box auf den
        // tatsächlichen Inhalt schrumpft. Prüft alle 150ms, weil OBS
        // die CSS-Variablen erst zur Laufzeit injiziert.
        (function () {
            let currentAnimFile = '';
            
            function updateLines() {
                const cs = getComputedStyle(document.documentElement);
                for (let n = 1; n <= 3; n++) {
                    const raw = (cs.getPropertyValue('--zeile-' + n) || '').trim();
                    // Umgebende Anführungszeichen des CSS-Strings entfernen
                    const text = raw.replace(/^["']|["']$/g, '');
                    const line = document.querySelector('.line' + n);
                    if (line) line.style.display = text ? '' : 'none';
                }
                
                // Animation Logic
                const showAnimRaw = (cs.getPropertyValue('--show-anim') || '').trim();
                const animFileRaw = (cs.getPropertyValue('--anim-file') || '').trim();
                const animFile = animFileRaw.replace(/^["']|["']$/g, '');
                const animWrapper = document.getElementById('anim-wrapper');
                
                if (showAnimRaw === '1' && animFile) {
                    animWrapper.style.display = 'block';
                    if (animFile !== currentAnimFile) {
                        currentAnimFile = animFile;
                        animWrapper.innerHTML = ''; // clear old
                        if (animFile.toLowerCase().endsWith('.webm') || animFile.toLowerCase().endsWith('.mp4')) {
                            const vid = document.createElement('video');
                            vid.src = animFile;
                            vid.autoplay = true;
                            vid.loop = true;
                            vid.muted = true;
                            animWrapper.appendChild(vid);
                        } else {
                            const img = document.createElement('img');
                            img.src = animFile;
                            animWrapper.appendChild(img);
                        }
                    }
                } else {
                    animWrapper.style.display = 'none';
                    if (currentAnimFile !== '') {
                        currentAnimFile = '';
                        animWrapper.innerHTML = '';
                    }
                }
            }
            updateLines();
            setInterval(updateLines, 150);
        })();
    </script>
</body>
</html>
