<!DOCTYPE html>
<!-- TEXTBOX_TEMPLATE: board
     "Platinenform"-Vorlage: Leiterplatten-Stil (PCB) mit Kupfer-Traces,
     Eck-Pads und dunklem Platinen-Hintergrund. Gleiche Token-Semantik und
     Live-Push-Unterstützung wie standard.html. -->
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
    :root {
        --zeile-1: "{{zeile1}}";
        --zeile-2: "{{zeile2}}";
        --zeile-3: "{{zeile3}}";
        --zeile-count: {{zeile-count}};
        --tb-bg-color: {{box_color}};
        --tb-text-color: {{text_color}};
        --tb-text-opacity: {{text_opacity}};
        --tb-box-opacity: {{box_opacity}};
        --trace-color-a: {{corner_a}};
        --trace-color-b: {{corner_b}};
        --trace-opacity-a: {{corner_op_a}};
        --trace-opacity-b: {{corner_op_b}};
        --anim-file: "{{anim_src}}";
        --show-anim: {{show_anim}};
        --anim-scale: {{anim_scale}};
        --anim-x: {{anim_x}}px;
        --anim-y: {{anim_y}}px;
        --box-x: {{box_x}}px;
        --box-y: {{box_y}}px;
        --box-scale: {{box_scale}};
        --card-id: "{{card_id}}";
        --clear: {{clear}};
    }
    html, body {
        margin: 0;
        padding: 0;
        width: 1280px;
        height: 720px;
        background: transparent;
        overflow: visible;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Platinen-Hintergrund (PCB): dunkler Grün-Verlauf mit feinem Raster */
    .pcb-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        background:
            linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
            linear-gradient(0deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
            var(--tb-bg-color);
        background-size: 40px 40px, 40px 40px, 100% 100%;
        opacity: var(--tb-box-opacity, 1);
        z-index: 0;
    }
    /* Kleine Vias/Lötpunkte auf der Platine (Deko) */
    .pcb-vias {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        z-index: 1;
        pointer-events: none;
    }
    .pcb-via {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(40, 76, 184, 0.15);
        border: 1px solid rgba(200, 132, 42, 0.2);
    }
    /* Kupfer-Traces als SVG – absolut positioniert über die Card-Grenze hinaus */
    .traces-svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        z-index: 2;
        pointer-events: none;
        overflow: visible;
    }
    .trace-pad-a {
        fill: var(--trace-color-a);
        opacity: var(--trace-opacity-a, 1);
    }
    .trace-line-a {
        stroke: var(--trace-color-a);
        stroke-width: 2px;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: var(--trace-opacity-a, 1);
    }
    .trace-pad-b {
        fill: var(--trace-color-b);
        opacity: var(--trace-opacity-b, 1);
    }
    .trace-line-b {
        stroke: var(--trace-color-b);
        stroke-width: 2px;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: var(--trace-opacity-b, 1);
    }
    /* Kartenbox – mittig, mit Platinen-Randstil */
    .card {
        position: absolute;
        left: 240px;
        top: 200px;
        width: 800px;
        height: auto;
        padding: 20px 28px;
        transform: translate(var(--box-x,0px), var(--box-y,0px)) scale(var(--box-scale,1));
        transform-origin: top left;
        box-sizing: border-box;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(200, 132, 42, 0.25);
        z-index: 5;
    }
    /* Eck-Pads (Kupfer-Kreise) an den äußersten Ecken */
    .corner-pad {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1.5px solid var(--trace-color-a);
        background: rgba(0, 0, 0, 0.3);
        z-index: 6;
    }
    .corner-pad-b {
        border-color: var(--trace-color-b);
    }
    .cp-tl { top: -5px;  left: -5px; }
    .cp-tr { top: -5px;  right: -5px; }
    .cp-bl { bottom: -5px; left: -5px; }
    .cp-br { bottom: -5px; right: -5px; }
    /* Regenbogen-Effekt auf den Traces/Pads */
    body.rainbow .traces-svg {
        animation: trace-rainbow 12s linear infinite;
    }
    body.rainbow .corner-pad {
        animation: pad-glow 12s linear infinite;
    }
    @keyframes trace-rainbow {
        from { filter: hue-rotate(0deg); }
        to   { filter: hue-rotate(360deg); }
    }
    @keyframes pad-glow {
        from { filter: hue-rotate(0deg); }
        to   { filter: hue-rotate(360deg); }
    }
    /* Textzeilen */
    .text-line { line-height: 1.2; color: var(--tb-text-color); }
    .text-line::before { display: inline-block; white-space: pre-wrap; }
    .line1::before { content: var(--zeile-1); font-size: 38px; font-weight: 500; margin-bottom: 5px; }
    .line2::before { content: var(--zeile-2); font-size: 32px; font-weight: 400; }
    .line3::before { content: var(--zeile-3); font-size: 32px; font-weight: 400; }
    /* Animation (über der Karte) */
    .anim-wrapper {
        position: absolute;
        bottom: 100%;
        right: 0;
        margin-bottom: 15px;
        z-index: 10;
        transform: translate(var(--anim-x, 0px), var(--anim-y, 0px)) scale(var(--anim-scale, 3));
        transform-origin: bottom right;
    }
    .anim-wrapper img, .anim-wrapper video {
        display: block;
        image-rendering: pixelated;
    }
</style>
</head>
<body class="{{rainbow}}" data-card-id="{{card_id}}">
<div class="pcb-bg"></div>
<div class="pcb-vias">
    <div class="pcb-via" style="left: 80px; top: 120px;"></div>
    <div class="pcb-via" style="left: 540px; top: 40px;"></div>
    <div class="pcb-via" style="left: 1180px; top: 160px;"></div>
    <div class="pcb-via" style="left: 60px; top: 540px;"></div>
    <div class="pcb-via" style="left: 1220px; top: 640px;"></div>
    <div class="pcb-via" style="left: 400px; top: 680px;"></div>
    <div class="pcb-via" style="left: 920px; top: 600px;"></div>
</div>
<svg class="traces-svg" width="1280" height="720" viewBox="0 0 1280 720">
    <!-- Trace oben links (corner_a) -->
    <path class="trace-line-a" d="M 260,200 L 100,200 L 100,80"/>
    <circle class="trace-pad-a" cx="260" cy="200" r="5"/>
    <circle class="trace-pad-a" cx="100" cy="80" r="4"/>
    <!-- Trace oben rechts (corner_a) -->
    <path class="trace-line-a" d="M 1020,200 L 1180,200 L 1180,80"/>
    <circle class="trace-pad-a" cx="1020" cy="200" r="5"/>
    <circle class="trace-pad-a" cx="1180" cy="80" r="4"/>
    <!-- Trace unten links (corner_b) -->
    <path class="trace-line-b" d="M 260,460 L 100,460 L 100,660"/>
    <circle class="trace-pad-b" cx="260" cy="460" r="5"/>
    <circle class="trace-pad-b" cx="100" cy="660" r="4"/>
    <!-- Trace unten rechts (corner_b) -->
    <path class="trace-line-b" d="M 1020,460 L 1180,460 L 1180,660"/>
    <circle class="trace-pad-b" cx="1020" cy="460" r="5"/>
    <circle class="trace-pad-b" cx="1180" cy="660" r="4"/>
</svg>
<div class="card">
    <div class="corner-pad cp-tl"></div>
    <div class="corner-pad cp-tr"></div>
    <div class="corner-pad cp-bl corner-pad-b"></div>
    <div class="corner-pad cp-br corner-pad-b"></div>
    <div class="anim-wrapper" id="anim-wrapper" style="display: none;"></div>
    <div class="text-line line1"></div>
    <div class="text-line line2"></div>
    <div class="text-line line3"></div>
</div>
<script>
    // Auto-verbirgt leere Zeilen und schaltet die Animation (wie standard.html).
    (function () {
        let currentAnimFile = '';
        function updateLines() {
            const cs = getComputedStyle(document.documentElement);
            for (let n = 1; n <= 3; n++) {
                const raw = (cs.getPropertyValue('--zeile-' + n) || '').trim();
                const text = raw.replace(/^["']|["']$/g, '');
                const line = document.querySelector('.line' + n);
                if (line) line.style.display = text ? '' : 'none';
            }
            const showAnimRaw = (cs.getPropertyValue('--show-anim') || '').trim();
            const animFileRaw = (cs.getPropertyValue('--anim-file') || '').trim();
            const animFile = animFileRaw.replace(/^["']|["']$/g, '');
            const animWrapper = document.getElementById('anim-wrapper');
            if (!animWrapper) return;
            if (showAnimRaw === '1' && animFile) {
                animWrapper.style.display = 'block';
                if (animFile !== currentAnimFile) {
                    currentAnimFile = animFile;
                    animWrapper.innerHTML = '';
                    if (animFile.toLowerCase().endsWith('.webm') || animFile.toLowerCase().endsWith('.mp4')) {
                        const vid = document.createElement('video');
                        vid.src = animFile; vid.autoplay = true; vid.loop = true; vid.muted = true;
                        animWrapper.appendChild(vid);
                    } else {
                        const img = document.createElement('img');
                        img.src = animFile;
                        animWrapper.appendChild(img);
                    }
                }
            } else {
                animWrapper.style.display = 'none';
                if (currentAnimFile !== '') {
                    currentAnimFile = '';
                    animWrapper.innerHTML = '';
                }
            }
        }
        updateLines();
        setInterval(updateLines, 150);

        // Live-Push vom Plugin (javascript_event -> CustomEvent), ohne Reload.
        window.addEventListener('textbox_card_update', function (ev) {
            const d = ev.detail;
            if (!d) return;
            const setVar = (name, value) => document.documentElement.style.setProperty(name, value);
            if (d.zeilen != null) {
                for (let i = 0; i < d.zeilen.length && i < 8; i++) {
                    setVar('--zeile-' + (i + 1), JSON.stringify(d.zeilen[i]));
                    if (d.vn && d.vn[i]) setVar(d.vn[i], JSON.stringify(d.zeilen[i]));
                }
                setVar('--zeile-count', String(d.zeilen.length));
            } else {
                if (d.zeile1 != null) setVar('--zeile-1', JSON.stringify(d.zeile1));
                if (d.zeile2 != null) setVar('--zeile-2', JSON.stringify(d.zeile2));
                if (d.zeile3 != null) setVar('--zeile-3', JSON.stringify(d.zeile3));
            }
            if (d.box_bg != null) setVar('--tb-bg-color', d.box_bg);
            if (d.text_color != null) setVar('--tb-text-color', d.text_color);
            if (d.triangle_color_a != null) {
                setVar('--trace-color-a', d.triangle_color_a);
            }
            if (d.triangle_color_b != null) {
                setVar('--trace-color-b', d.triangle_color_b);
            }
            if (d.anim_file != null) setVar('--anim-file', JSON.stringify(d.anim_file));
            if (d.show_anim != null) setVar('--show-anim', String(d.show_anim));
            if (d.anim_scale != null) setVar('--anim-scale', String(d.anim_scale));
            if (d.anim_x != null) setVar('--anim-x', String(d.anim_x) + 'px');
            if (d.anim_y != null) setVar('--anim-y', String(d.anim_y) + 'px');
            if (d.box_x != null) setVar('--box-x', String(d.box_x) + 'px');
            if (d.box_y != null) setVar('--box-y', String(d.box_y) + 'px');
            if (d.box_scale != null) setVar('--box-scale', String(d.box_scale));
            document.body.classList.toggle('rainbow', !!d.rainbow);
        });
    })();
</script>
</body>
</html>
